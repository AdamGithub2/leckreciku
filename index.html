<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Plantiano Flight - Leć Kreciku</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #rotate-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(13, 17, 23, 0.96);
        z-index: 999999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      @media screen and (orientation: portrait) and (max-width: 950px) {
        #rotate-overlay {
          display: flex !important;
        }
      }
      .rotate-phone-icon {
        font-size: 56px;
        margin-bottom: 20px;
        display: inline-block;
        animation: rotatePhone 2.2s infinite ease-in-out;
      }
      @keyframes rotatePhone {
        0% { transform: rotate(0deg); }
        40% { transform: rotate(-90deg); }
        70% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
    </style>
  </head>
  <body>
    <div id="rotate-overlay">
      <div class="rotate-phone-icon">📱 ➔ 🔄</div>
      <h2 style="margin: 0 0 12px; color: #ffcc00; font-size: 24px; font-weight: bold;">Obróć telefon poziomo</h2>
      <p style="margin: 0 0 14px; color: #e6edf3; font-size: 16px; max-width: 320px; line-height: 1.5;">
        <b>Leć Kreciku</b> to zręcznościowa gra pozioma (landscape).
      </p>
      <p style="margin: 0; color: #8b949e; font-size: 14px; max-width: 300px; line-height: 1.4;">
        Włącz automatyczne obracanie w telefonie i przekręć go na bok, aby naciągać procę i śledzić lot!
      </p>
    </div>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Plantiano Flight - Leć Kreciku &copy; 2026 Adam Misiura</div>
      </div>
    </div>
    <script>
      // ==========================================
      // LICENSED DOMAIN LOCK (Ochrona Autorska)
      // Właściciel praw autorskich: Adam Misiura
      // ==========================================
      const currentHost = window.location.hostname.toLowerCase();
      const isAuthorized = 
        currentHost === "adamgithub2.github.io" || 
        currentHost.endsWith(".adamgithub2.github.io") || 
        currentHost === "adammisiura.pl" || 
        currentHost.endsWith(".adammisiura.pl") || 
        currentHost === "localhost" || 
        currentHost === "127.0.0.1" || 
        currentHost === "";

      if (!isAuthorized) {
        document.body.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0d1117;color:#f0f6fc;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box;">
            <div style="background:#161b22;border:1px solid #30363d;border-radius:16px;padding:32px;max-width:520px;box-shadow:0 8px 32px rgba(0,0,0,0.5);">
              <div style="font-size:48px;margin-bottom:16px;">🛑</div>
              <h2 style="margin:0 0 12px;color:#f85149;font-size:24px;">Dostęp zablokowany</h2>
              <p style="margin:0 0 16px;color:#8b949e;line-height:1.5;">
                Gra <b>Plantiano Flight (Leć Kreciku)</b> jest chroniona prawem autorskim i licencją.<br>
                Właścicielem praw autorskich jest <b>Adam Misiura</b>.
              </p>
              <p style="margin:0 0 24px;color:#e6edf3;font-size:14px;background:#21262d;padding:12px;border-radius:8px;border:1px solid #30363d;">
                Wykryto nieautoryzowaną domenę: <code style="color:#ff7b72;">${currentHost}</code>.<br>
                Gra może być uruchamiana wyłącznie na oficjalnej stronie autora.
              </p>
              <a href="https://adamgithub2.github.io/leckreciku/" style="display:inline-block;background:#238636;color:white;text-decoration:none;font-weight:bold;padding:12px 24px;border-radius:8px;font-size:16px;">Przejdź do oficjalnej gry</a>
            </div>
          </div>
        `;
        throw new Error("SiteLock: Unauthorized domain " + currentHost);
      }
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Build_GitHubPages.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Build_GitHubPages.data",
        frameworkUrl: buildUrl + "/Build_GitHubPages.framework.js",
        codeUrl: buildUrl + "/Build_GitHubPages.wasm",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "DefaultCompany",
        productName: "Katapulta",
        productVersion: "4.0.1",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "540px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
